<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>书角寻宝 · 双层精装版</title>
  <style>
    :root{--ink:#352419;--paper:#fff8e8;--gold:#e6b74f;--teal:#347b7d;--green:#43846b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17100c;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}
    .game{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(circle,#4f3825,#160e0a 75%)}
    .entrance{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 43%,#f7e9ca,#ad875d 76%,#543a27);transition:opacity .75s,transform 1.1s cubic-bezier(.2,.8,.2,1)}.entrance.leaving{opacity:0;transform:scale(1.28);pointer-events:none}
    .outside{position:relative;height:min(88vh,760px);aspect-ratio:1;max-width:96vw;filter:drop-shadow(0 25px 38px #2b170c88)}.outside>img{width:100%;height:100%;object-fit:contain}
    .title{position:absolute;left:50%;top:3%;translate:-50%;text-align:center;white-space:nowrap;color:#fff8e5;text-shadow:0 3px 12px #21100b;background:#352116d9;border:2px solid #f1d18d;border-radius:18px;padding:11px 20px;backdrop-filter:blur(6px);animation:float 3s ease-in-out infinite}.title h1{font:900 clamp(21px,3vw,38px) Georgia,serif;letter-spacing:.12em;margin:0}.title p{margin:4px 0 0;color:#ffe7a7;font-size:13px}
    .door{position:absolute;left:59.5%;top:56%;width:18%;height:34%;border:0;background:transparent;border-radius:10px;cursor:pointer}.door::before{content:"";position:absolute;inset:0;border:3px solid #ffd675;border-radius:10px;box-shadow:0 0 30px 8px #ffd67588;animation:pulse 1.8s infinite}.door::after{content:"推门进入";position:absolute;left:50%;bottom:-44px;translate:-50%;white-space:nowrap;background:#fff7df;border:2px solid #76512e;border-radius:999px;padding:9px 18px;font-weight:900;box-shadow:0 7px 18px #28160b66}
    .room{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s}.room.active{opacity:1;pointer-events:auto}.viewport{position:absolute;inset:0;overflow:hidden;background:#0e0906;cursor:grab;touch-action:none}.viewport.dragging{cursor:grabbing}
    .world{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh * 1.7779));height:min(100vh,calc(100vw / 1.7779));transform:translate(-50%,-50%) scale(1);transform-origin:50% 50%;transition:transform .38s ease;will-change:transform}.world.no-anim{transition:none}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}.floor{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}.floor.current{opacity:1;pointer-events:auto}
    .hotspot{position:absolute;border:0;background:transparent;cursor:pointer;outline:0;padding:0}.target-sprite{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 4px #2d170b55);transition:.2s;user-select:none;-webkit-user-drag:none}.hotspot:hover .target-sprite{transform:scale(1.04)}.hotspot.found{pointer-events:none}.hotspot.found .target-sprite{animation:vanish .72s cubic-bezier(.3,.8,.2,1) forwards}.hotspot.hint-glow{background:radial-gradient(ellipse,#fff09c66,transparent 70%);animation:softGlow 1.7s ease}.hotspot.hint-glow::after{content:"🐾";position:absolute;left:50%;top:35%;font-size:25px;filter:drop-shadow(0 0 8px #fff);animation:float .7s ease-in-out infinite}.cat-spot,.secret-spot{position:absolute;border:0;background:transparent;cursor:pointer;outline:0}.cat-spot:hover{filter:drop-shadow(0 0 10px #ffd96f)}
    .stairs{position:absolute;border:0;background:linear-gradient(90deg,transparent,#ffe19322);cursor:pointer;border-radius:30px;color:#fff;outline:0}.stairs span{position:absolute;left:50%;top:50%;translate:-50% -50%;white-space:nowrap;background:#2f2119dc;border:2px solid #f0cc83;border-radius:999px;padding:10px 15px;font-weight:900;box-shadow:0 8px 22px #0008;animation:pulseLabel 2s infinite}.stairs:hover span{background:#68472a;transform:scale(1.06)}
    .topbar{position:absolute;z-index:12;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.floor-pill,.tools button{pointer-events:auto;background:#35251ddd;color:#fff7df;border:2px solid #e4bf78;box-shadow:0 8px 25px #0008;backdrop-filter:blur(7px)}.floor-pill{border-radius:999px;padding:9px 15px;font-weight:900;letter-spacing:.06em}.tools{display:flex;gap:7px}.tools button{width:42px;height:42px;border-radius:50%;cursor:pointer;font-weight:1000;font-size:18px}.tools button:hover{background:#69482e}
    .quest{position:absolute;z-index:13;left:14px;top:70px;width:164px;max-height:calc(100vh - 100px);overflow:auto;background:#fffdf8ed;border:0;border-radius:22px;padding:10px;box-shadow:0 12px 35px #0008;backdrop-filter:blur(9px);scrollbar-width:thin}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{position:relative;aspect-ratio:1;background:#fff;border:0;border-radius:15px;overflow:hidden;transition:.35s;box-shadow:0 3px 10px #39210f24}.card.done{opacity:.35;filter:grayscale(.8);transform:scale(.91)}.card.done::after{content:"✓";position:absolute;right:5px;top:3px;color:#23845d;font-size:18px;font-weight:1000}.thumb{position:absolute;inset:3px;border-radius:12px;background-color:#fff;background-image:url('assets/target-cutouts-v3.png');background-repeat:no-repeat;background-size:400% 200%}
    .progress{height:6px;background:#dfcba5;border-radius:99px;margin-top:11px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4a9b7c,#f0be50);transition:.4s}.progress-text{text-align:center;font-size:11px;margin-top:5px;font-weight:800}
    .hint{position:absolute;z-index:14;left:50%;bottom:max(15px,env(safe-area-inset-bottom));translate:-50%;white-space:nowrap;background:#2e2118df;color:#fff2cc;border:1px solid #d9b576;border-radius:999px;padding:9px 15px;box-shadow:0 8px 24px #0008;font-size:20px;letter-spacing:.25em;transition:.4s}.hint.hide{opacity:0;transform:translateY(12px)}.lens{display:none;position:absolute;z-index:11;width:190px;height:190px;border-radius:50%;overflow:hidden;pointer-events:none;border:7px solid #f4d692;box-shadow:0 12px 34px #0009,inset 0 0 0 2px #fff;background:#20140e}.lens.on{display:block}.lens::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 32px #0008}.lens-copy{position:absolute;pointer-events:none;transform-origin:0 0}.lens-copy .stairs span{display:none}.room.night .scene{filter:brightness(.58) saturate(1.35) hue-rotate(6deg)}.room.night::after{content:"";position:absolute;z-index:5;inset:0;pointer-events:none;background:radial-gradient(circle at 68% 35%,transparent 0 14%,#08102760 65%);mix-blend-mode:multiply}.burst{position:absolute;z-index:24;pointer-events:none;font-size:22px;animation:spark 1.05s ease-out forwards}.shooting{position:absolute;z-index:20;width:120px;height:3px;background:linear-gradient(90deg,transparent,#fff,#ffd36b);box-shadow:0 0 14px #fff;border-radius:99px;transform:rotate(-25deg);animation:shoot 1.2s ease-in forwards;pointer-events:none}
    .floor-wipe{position:absolute;z-index:25;inset:0;pointer-events:none;background:#1b110b;opacity:0}.floor-wipe.go{animation:wipe .72s ease}.win{position:absolute;z-index:40;inset:0;display:none;place-items:center;background:#20140ab9;backdrop-filter:blur(8px)}.win.show{display:grid;animation:fade .4s}.win-card{text-align:center;width:min(440px,90vw);background:#fff8e8;border:4px solid #d5a74f;border-radius:28px;padding:31px 24px;box-shadow:0 25px 70px #0009;animation:winPop .65s cubic-bezier(.2,1.3,.3,1)}.win-card .star{font-size:58px}.win-card h2{font:900 clamp(29px,6vw,46px) Georgia,serif;margin:6px 0;color:#60401f}.win-card p{line-height:1.7;margin:0 0 20px}.again{border:0;border-radius:999px;background:linear-gradient(#4e9998,#2f7071);color:white;padding:13px 27px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #205253}.again:active{transform:translateY(3px);box-shadow:0 3px 0 #205253}.spark{position:absolute;z-index:39;pointer-events:none;font-size:28px;animation:spark 1.4s forwards}
    @keyframes pulse{50%{box-shadow:0 0 0 7px #ffe09835,0 0 44px 14px #ffd675aa}}@keyframes pulseLabel{50%{box-shadow:0 0 25px #ffdd7eaa}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes vanish{0%{opacity:1;transform:scale(1) rotate(0)}45%{opacity:.9;transform:scale(1.18) rotate(-5deg);filter:drop-shadow(0 0 20px #ffe585)}100%{opacity:0;transform:scale(.08) translateY(-50px) rotate(18deg);filter:blur(7px)}}@keyframes softGlow{25%,70%{filter:drop-shadow(0 0 20px #fff176) drop-shadow(0 0 35px #ffd23f);background:#fff38b28}}@keyframes wipe{50%{opacity:.92}}@keyframes fade{from{opacity:0}}@keyframes winPop{from{opacity:0;transform:scale(.65) rotate(-3deg)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}@keyframes shoot{from{left:75%;top:10%;opacity:0}20%{opacity:1}to{left:12%;top:48%;opacity:0}}
    @media(max-width:700px){.quest{left:7px;top:auto;bottom:8px;width:calc(100% - 14px);max-height:none;padding:6px}.cards{grid-template-columns:repeat(4,1fr);gap:5px}.card{aspect-ratio:1.35}.progress{margin-top:5px}.progress-text{display:none}.hint{bottom:92px;font-size:17px;max-width:88vw}.topbar{left:7px;right:7px;top:7px}.floor-pill{font-size:12px;padding:8px 11px}.tools button{width:35px;height:35px;font-size:15px}.stairs span{font-size:11px;padding:7px 10px}.lens{width:145px;height:145px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body><main class="game">
  <section class="entrance" id="entrance"><div class="outside"><img src="assets/exterior.jpg" alt="童话书店外景"><div class="title"><h1>THE BOOK NOOK</h1><p>双层寻宝 · 按图寻找</p></div><button class="door" id="enter" aria-label="推门进入书店"></button></div></section>
  <section class="room" id="room" aria-hidden="true"><div class="viewport" id="viewport"><div class="world" id="world">
    <div class="floor current" data-floor="ground"><img class="scene" src="assets/ground-clean-v4.png" alt="书店一楼"><div class="spots"></div><button class="cat-spot" data-cat style="left:29%;top:42%;width:10%;height:12%" aria-label="抚摸猫咪"></button><button class="secret-spot" data-secret="crystal" style="left:92%;top:57%;width:7%;height:18%" aria-label="神秘水晶"></button><button class="stairs" data-go="up" style="left:82%;top:11%;width:18%;height:60%"><span>上楼看看 ↑</span></button></div>
    <div class="floor" data-floor="up"><img class="scene" src="assets/upstairs-clean-v4.png" alt="书店二楼阁楼"><div class="spots"></div><button class="cat-spot" data-cat style="left:27%;top:37%;width:9%;height:12%" aria-label="抚摸猫咪"></button><button class="secret-spot" data-secret="moon" style="left:25%;top:8%;width:18%;height:28%" aria-label="月亮窗"></button><button class="stairs" data-go="ground" style="left:78%;top:61%;width:22%;height:39%"><span>回到一楼 ↓</span></button></div>
  </div></div><div class="lens" id="lens"><div class="lens-copy" id="lensCopy"></div></div>
  <div class="topbar"><div class="floor-pill" id="floorName">Ⅰ 一楼 · 温暖书厅</div><div class="tools"><button id="lensBtn" aria-label="移动放大镜">⌕</button><button id="catHint" aria-label="请猫咪帮忙">🐾</button><button id="night" aria-label="切换夜间灯光">☾</button><button id="minus" aria-label="缩小">−</button><button id="resetZoom" aria-label="恢复大小">1×</button><button id="plus" aria-label="放大">＋</button><button id="sound" aria-label="关闭音效">♫</button><button id="home" aria-label="回到门外">↩</button></div></div>
  <aside class="quest" aria-label="需要寻找的物品图片"><div class="cards" id="cards"></div><div class="progress"><i id="bar"></i></div><div class="progress-text" id="progressText">0 / 4</div></aside>
  <div class="hint" id="hint">⌕ · 🐾 · ☾</div><div class="floor-wipe" id="wipe"></div></section>
  <div class="win" id="win" role="dialog" aria-modal="true"><div class="win-card"><div class="star">🔑✨</div><h2>第一关完成！</h2><p id="winText"></p><a class="again" href="town.html" style="display:inline-block;text-decoration:none;margin-right:8px">前往动物小镇</a><button class="again" id="again">再玩一次</button></div></div>
</main>
<script>
  const DATA=[
    {id:'moon-book',name:'月纹蓝书',floor:'ground',kind:'书',x:39.5,y:49,w:9,h:17,cx:44,cy:57},{id:'clasp-book',name:'金扣红书',floor:'ground',kind:'书',x:5,y:72,w:12,h:11,cx:11,cy:77},{id:'green-pendant',name:'绿珐琅吊灯',floor:'ground',kind:'灯',x:30,y:8,w:10,h:18,cx:35,cy:17},{id:'mosaic-lamp',name:'翡翠花灯',floor:'ground',kind:'灯',x:0,y:52,w:10,h:25,cx:5,cy:64},
    {id:'owl-book',name:'金鸮紫书',floor:'up',kind:'书',x:11,y:57,w:15,h:17,cx:18,cy:65},{id:'sun-book',name:'太阳绿书',floor:'up',kind:'书',x:62,y:52,w:13,h:12,cx:68,cy:58},{id:'star-lantern',name:'五芒星灯',floor:'up',kind:'灯',x:18,y:1,w:10,h:20,cx:23,cy:11},{id:'crescent-lamp',name:'月牙壁灯',floor:'up',kind:'灯',x:78,y:4,w:10,h:25,cx:83,cy:16}
  ];
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],floorImgs={ground:'assets/ground-floor-v2.png',up:'assets/upstairs-v2.png'},spritePos=[[0,0],[33.33,0],[66.67,0],[100,0],[0,100],[33.33,100],[66.67,100],[100,100]];let targets=[],found=new Set(),floor='ground',zoom=1,pan={x:0,y:0},soundOn=true,audio,started=0,drag=null,lensOn=false;
  function tone(f=500,d=.12,type='sine'){if(!soundOn)return;audio ||= new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
  function hint(t,ms=1900){const h=$('#hint');h.textContent=t;h.classList.remove('hide');clearTimeout(h.t);h.t=setTimeout(()=>h.classList.add('hide'),ms)}
  function makeGame(){const g=DATA.filter(x=>x.floor==='ground').sort(()=>Math.random()-.5).slice(0,2),u=DATA.filter(x=>x.floor==='up').sort(()=>Math.random()-.5).slice(0,2);targets=[...g,...u].sort(()=>Math.random()-.5);found.clear();started=Date.now();render();switchFloor('ground',false);$('#win').classList.remove('show');hint('⌕ · 🐾 · ☾',2600)}
  function render(){$$('.spots').forEach(s=>s.innerHTML='');DATA.forEach(item=>{const host=$(`.floor[data-floor="${item.floor}"] .spots`),b=document.createElement('button');b.className='hotspot';b.dataset.id=item.id;b.style.cssText=`left:${item.x}%;top:${item.y}%;width:${item.w}%;height:${item.h}%`;b.setAttribute('aria-label',item.name);b.innerHTML=`<img class="target-sprite" src="assets/target-${item.id}.png" alt="">`;b.onclick=e=>{e.stopPropagation();collect(item,b)};host.appendChild(b)});const cards=$('#cards');cards.innerHTML='';targets.forEach(item=>{const i=DATA.indexOf(item),p=spritePos[i],c=document.createElement('div');c.className='card';c.dataset.id=item.id;c.setAttribute('aria-label','目标物图片');c.innerHTML=`<span class="thumb" style="background-position:${p[0]}% ${p[1]}%"></span>`;cards.appendChild(c)});update();syncLens()}
  function burst(el,icons=['✦','✧','·']){const r=el.getBoundingClientRect();for(let i=0;i<13;i++){const s=document.createElement('i');s.className='burst';s.textContent=icons[i%icons.length];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*150-75)+'px');s.style.setProperty('--dy',(Math.random()*150-90)+'px');s.style.color=['#fff4a5','#ffd04d','#75dbc1'][i%3];document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}
  function collect(item,el){if(!targets.some(t=>t.id===item.id)){tone(150,.08,'square');return}if(found.has(item.id))return;found.add(item.id);el.classList.add('found');burst(el);tone(item.kind==='书'?610:820,.18,'triangle');update();syncLens();if(found.size===targets.length)setTimeout(win,600)}
  function update(){$$('.card').forEach(c=>c.classList.toggle('done',found.has(c.dataset.id)));$('#bar').style.width=found.size/targets.length*100+'%';$('#progressText').textContent=`${found.size} / ${targets.length}`}
  function switchFloor(next,animate=true){floor=next;if(animate){$('#wipe').classList.remove('go');void $('#wipe').offsetWidth;$('#wipe').classList.add('go');tone(next==='up'?460:330,.2,'triangle')}setTimeout(()=>{$$('.floor').forEach(f=>f.classList.toggle('current',f.dataset.floor===next));$('#floorName').textContent=next==='ground'?'Ⅰ 一楼 · 温暖书厅':'Ⅱ 二楼 · 月光阁楼';setZoom(1,true);syncLens();hint(next==='ground'?'Ⅰ ↓':'Ⅱ ↑')},animate?340:0)}
  function setZoom(v,reset=false){zoom=Math.max(1,Math.min(2.6,v));if(reset||zoom===1)pan={x:0,y:0};applyTransform();$('#resetZoom').textContent=zoom.toFixed(zoom%1?1:0)+'×'}function applyTransform(){$('#world').style.transform=`translate(calc(-50% + ${pan.x}px),calc(-50% + ${pan.y}px)) scale(${zoom})`}
  function win(){tone(650,.18);setTimeout(()=>tone(900,.24),130);$('#winText').textContent=`你穿梭两层书店，找齐了 4 件指定藏品，用时 ${Math.max(1,Math.round((Date.now()-started)/1000))} 秒。`;$('#win').classList.add('show');for(let i=0;i<18;i++){const s=document.createElement('i');s.className='spark';s.textContent=['✦','★','✧'][i%3];s.style.left=45+Math.random()*10+'%';s.style.top=45+Math.random()*10+'%';s.style.setProperty('--dx',(Math.random()*500-250)+'px');s.style.setProperty('--dy',(Math.random()*500-300)+'px');s.style.color=['#ffd25f','#fff4b8','#70d2bd'][i%3];document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
  $('#enter').onclick=()=>{tone(220,.25,'triangle');$('#entrance').classList.add('leaving');setTimeout(()=>{$('#room').classList.add('active');$('#room').setAttribute('aria-hidden','false');makeGame()},430)};$$('.stairs').forEach(b=>b.onclick=e=>{e.stopPropagation();switchFloor(b.dataset.go)});$('#plus').onclick=()=>setZoom(zoom+.35);$('#minus').onclick=()=>setZoom(zoom-.35);$('#resetZoom').onclick=()=>setZoom(1,true);$('#again').onclick=makeGame;$('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'×';if(soundOn)tone(600,.1)};$('#home').onclick=()=>location.href='index.html';
  function felineHint(){const left=targets.filter(t=>!found.has(t.id)),same=left.filter(t=>t.floor===floor),item=same[0]||left[0];if(!item)return;tone(240,.32,'sine');const reveal=()=>{const el=$(`.hotspot[data-id="${item.id}"]`);el.classList.add('hint-glow');burst(el,['🐾','✦']);setTimeout(()=>el.classList.remove('hint-glow'),1750)};if(item.floor!==floor){switchFloor(item.floor);setTimeout(reveal,760)}else reveal()}
  $$('[data-cat]').forEach(c=>c.onclick=e=>{e.stopPropagation();burst(c,['🐾','♡']);felineHint()});$('#catHint').onclick=felineHint;$('#night').onclick=e=>{const on=$('#room').classList.toggle('night');e.currentTarget.textContent=on?'☀':'☾';tone(on?310:650,.2,'triangle')};
  $$('[data-secret]').forEach(s=>s.onclick=e=>{e.stopPropagation();if(s.dataset.done)return;s.dataset.done='1';if(s.dataset.secret==='crystal'){burst(s,['◆','✦','◇']);tone(980,.4,'sine')}else{const star=document.createElement('i');star.className='shooting';$('#room').appendChild(star);tone(760,.5,'triangle');setTimeout(()=>star.remove(),1300)}});
  function syncLens(){const c=$('#lensCopy'),w=$('#world');c.innerHTML=w.innerHTML;c.querySelectorAll('button').forEach(b=>b.tabIndex=-1)}
  $('#lensBtn').onclick=e=>{lensOn=!lensOn;$('#lens').classList.toggle('on',lensOn);e.currentTarget.style.background=lensOn?'#8a6335':'';syncLens();tone(lensOn?720:390,.12,'triangle')};
  function moveLens(e){if(!lensOn)return;const lens=$('#lens'),copy=$('#lensCopy'),wr=$('#world').getBoundingClientRect(),r=lens.offsetWidth/2,m=2.25;lens.style.left=(e.clientX-r)+'px';lens.style.top=(e.clientY-r)+'px';copy.style.width=wr.width+'px';copy.style.height=wr.height+'px';copy.style.left=(r-(e.clientX-wr.left)*m)+'px';copy.style.top=(r-(e.clientY-wr.top)*m)+'px';copy.style.transform=`scale(${m})`}
  const vp=$('#viewport');vp.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?.25:-.25))},{passive:false});vp.addEventListener('pointerdown',e=>{if(zoom<=1||e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging');$('#world').classList.add('no-anim')});vp.addEventListener('pointermove',e=>{moveLens(e);if(!drag)return;pan.x=drag.px+(e.clientX-drag.x);pan.y=drag.py+(e.clientY-drag.y);applyTransform()});function endDrag(){drag=null;vp.classList.remove('dragging');$('#world').classList.remove('no-anim')}vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);vp.addEventListener('pointerleave',()=>$('#lens').style.opacity=0);vp.addEventListener('pointerenter',()=>$('#lens').style.opacity=1);
</script></body></html>
