<div class="curtain" id="intro"><div class="story"><img class="mini" src="assets/elephant-maze-reference.jpg" alt="彩色花纹大象"><h1>小老鼠出发啦</h1><p>六滴颜料散落在大象的纹样里。请带着小老鼠走过迷宫，让它沿途留下彩色脚印，并把完整的彩色大象带回来。</p><button class="primary" id="startBtn">小鼠出发</button></div></div>
<div class="curtain hidden" id="win"><div class="story victory"><img class="mini" src="assets/elephant-maze-reference.jpg" alt="完成填色的花纹大象"><h1>彩绘完成！</h1><p id="winCopy">你让所有纹样重新亮了起来。</p><div class="victory-actions"><button class="primary" id="againBtn">再画一次</button><a class="secondary" href="index.html">返回关卡选择</a></div></div></div>
<div class="toast" id="toast"></div>
<script>
const N=10,START=N*9+1,GOAL=N*4+9;
const COLORS=[
  {name:'阳光橙',hex:'#ff793e',icon:'●'},
  {name:'蒲公英黄',hex:'#ffd45a',icon:'●'},
  {name:'湖水青',hex:'#36d1c4',icon:'●'},
  {name:'羽毛蓝',hex:'#4d83e8',icon:'●'},
  {name:'梦境紫',hex:'#985ed8',icon:'●'},
  {name:'爱心红',hex:'#f05b78',icon:'●'}
];
let cells=[],path=[],checkpoints=new Map(),pos=START,currentColor='#fff3d8',unlocked=new Set(),steps=0,started=false,audio,toastTimer,facing='right';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function randMaker(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function shuffled(arr,rand){return arr.map(v=>[rand(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])}
function buildMaze(){
  const rand=randMaker(280519),dirs=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
  cells=Array.from({length:N*N},()=>({walls:[1,1,1,1],seen:false}));
  const stack=[START];cells[START].seen=true;
  while(stack.length){const here=stack[stack.length-1],r=Math.floor(here/N),c=here%N;const options=shuffled(dirs,rand).filter(([dr,dc])=>{const nr=r+dr,nc=c+dc;return nr>=0&&nr<N&&nc>=0&&nc<N&&!cells[nr*N+nc].seen});if(!options.length){stack.pop();continue}const [dr,dc,w,ow]=options[0],next=(r+dr)*N+c+dc;cells[here].walls[w]=0;cells[next].walls[ow]=0;cells[next].seen=true;stack.push(next)}
  const parent=Array(N*N).fill(-1),queue=[START];parent[START]=START;
  for(let qi=0;qi<queue.length;qi++){const here=queue[qi];if(here===GOAL)break;const r=Math.floor(here/N),c=here%N;dirs.forEach(([dr,dc,w])=>{const nr=r+dr,nc=c+dc,next=nr*N+nc;if(nr>=0&&nr<N&&nc>=0&&nc<N&&!cells[here].walls[w]&&parent[next]<0){parent[next]=here;queue.push(next)}})}
  path=[];for(let p=GOAL;;p=parent[p]){path.push(p);if(p===START)break}path.reverse();
  checkpoints.clear();const used=new Set();COLORS.forEach((color,i)=>{let at=path[Math.round((i+1)*path.length/7)];while(used.has(at))at=path[Math.min(path.length-2,path.indexOf(at)+1)];used.add(at);checkpoints.set(at,i)});
}
function render(){
  const maze=$('#maze');maze.style.gridTemplateColumns=`repeat(${N},1fr)`;maze.innerHTML='';
  cells.forEach((data,i)=>{const b=document.createElement('button');b.className='cell';b.dataset.i=i;b.setAttribute('aria-label',`迷宫第${Math.floor(i/N)+1}行第${i%N+1}格`);const [t,r,bt,l]=data.walls;b.style.borderTop=t?'2px solid var(--wall)':'2px solid transparent';b.style.borderRight=r?'2px solid var(--wall)':'2px solid transparent';b.style.borderBottom=bt?'2px solid var(--wall)':'2px solid transparent';b.style.borderLeft=l?'2px solid var(--wall)':'2px solid transparent';if(i===START)b.innerHTML='<span class="start-flag">🏁</span>';if(i===GOAL)b.innerHTML='<span class="goal">💗</span>';if(checkpoints.has(i)){const ci=checkpoints.get(i);b.innerHTML=`<span class="pigment" style="--pigment:${COLORS[ci].hex}" title="${COLORS[ci].name}"></span>`}b.onclick=()=>clickCell(i);maze.appendChild(b)});
  $('#palette').innerHTML=COLORS.map((c,i)=>`<button class="swatch" data-color="${i}" style="--c:${c.hex}" aria-label="${c.name}" title="${c.name}"><span style="color:${c.hex}">${c.icon}</span></button>`).join('');
  $$('.swatch').forEach(b=>b.onclick=()=>selectColor(+b.dataset.color));paintCell(START,'#fff3d8');drawPlayer();updateUI();
}
function cellEl(i){return $(`.cell[data-i="${i}"]`)}
function drawPlayer(){document.querySelector('.player')?.remove();const p=document.createElement('span');p.className='player';p.dataset.facing=facing;p.setAttribute('aria-label','正在走迷宫的小老鼠');p.style.setProperty('--brush',currentColor);p.innerHTML=`<span class="mouse-runner" aria-hidden="true"><svg viewBox="0 0 108 76"><g class="mouse-body"><path class="mouse-tail" d="M24 43C4 50 1 32 12 25C18 21 22 24 22 28" fill="none" stroke="#6f5148" stroke-width="5" stroke-linecap="round"/><ellipse cx="49" cy="39" rx="28" ry="20" fill="#9f8277" stroke="#3b2d35" stroke-width="4"/><circle cx="76" cy="31" r="17" fill="#ae9084" stroke="#3b2d35" stroke-width="4"/><circle cx="67" cy="15" r="10" fill="#aa887e" stroke="#3b2d35" stroke-width="4"/><circle cx="67" cy="15" r="5" fill="#f1adae"/><circle cx="82" cy="15" r="9" fill="#aa887e" stroke="#3b2d35" stroke-width="4"/><circle cx="82" cy="15" r="4" fill="#f1adae"/><circle cx="81" cy="28" r="3" fill="#211a20"/><circle cx="82" cy="27" r="1" fill="white"/><circle cx="94" cy="35" r="4" fill="#e77982" stroke="#3b2d35" stroke-width="2"/><path d="M91 38L105 43M91 34L106 33M91 31L103 25" stroke="#3b2d35" stroke-width="2" stroke-linecap="round"/><path class="mouse-leg-a" d="M39 51L32 66L25 67M65 47L72 62L82 63" fill="none" stroke="#3b2d35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="mouse-leg-b" d="M49 53L55 68L64 68M72 43L82 55L91 54" fill="none" stroke="#3b2d35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg></span>`;cellEl(pos).appendChild(p)}
function paintCell(i,color){const cell=cellEl(i);cell.classList.add('painted');cell.style.setProperty('--paint',color)}
function tone(freq=620,d=.12){try{audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
function collect(index,cell){if(unlocked.has(index))return;unlocked.add(index);currentColor=COLORS[index].hex;cell.querySelector('.pigment')?.classList.add('got');setTimeout(()=>cell.querySelector('.pigment')?.remove(),430);$$('.color-layer')[index].classList.add('unlocked');tone(680+index*70,.24);showToast(`找到${COLORS[index].name}！大象的一片纹样亮起来了`);updateUI()}
function move(dir){if(!started)return;facing=dir;const deltas={up:[-1,0,0],right:[0,1,1],down:[1,0,2],left:[0,-1,3]},[dr,dc,wall]=deltas[dir],r=Math.floor(pos/N),c=pos%N,nr=r+dr,nc=c+dc;if(nr<0||nr>=N||nc<0||nc>=N||cells[pos].walls[wall]){drawPlayer();tone(170,.08);cellEl(pos).animate([{transform:'translateX(-2px)'},{transform:'translateX(2px)'},{transform:'none'}],{duration:170});return}pos=nr*N+nc;steps++;const target=cellEl(pos);if(checkpoints.has(pos))collect(checkpoints.get(pos),target);paintCell(pos,currentColor);drawPlayer();updateUI();tone(410+steps%4*35,.06);if(pos===GOAL){if(unlocked.size===COLORS.length)finish();else showToast('爱心还在等所有颜色') }}
function clickCell(i){if(!started)return;const r=Math.floor(pos/N),c=pos%N,tr=Math.floor(i/N),tc=i%N;if(Math.abs(r-tr)+Math.abs(c-tc)!==1){showToast('小老鼠每次只能走到相邻的一格');return}if(tr<r)move('up');else if(tr>r)move('down');else if(tc<c)move('left');else move('right')}
function selectColor(i){if(!unlocked.has(i)){showToast('要先在迷宫里找到这滴颜料');return}currentColor=COLORS[i].hex;drawPlayer();updateUI();tone(560+i*55,.1)}
function updateUI(){$('#paintCount').textContent=`${unlocked.size} / ${COLORS.length}`;$('#stepCount').textContent=steps;const pct=Math.round(unlocked.size/COLORS.length*100);$('#progressText').textContent=`${pct}%`;$('#progressFill').style.width=`${pct}%`;$$('.swatch').forEach((b,i)=>{b.classList.toggle('unlocked',unlocked.has(i));b.classList.toggle('active',unlocked.has(i)&&COLORS[i].hex===currentColor)})}
function finish(){started=false;$$('.color-layer').forEach(l=>l.classList.add('unlocked'));tone(880,.22);setTimeout(()=>tone(1100,.3),180);$('#winCopy').textContent=`你用 ${steps} 步找回六种颜色，让所有纹样重新亮了起来。`;setTimeout(()=>$('#win').classList.remove('hidden'),650)}
function restart(){pos=START;facing='right';currentColor='#fff3d8';unlocked.clear();steps=0;started=true;$$('.color-layer').forEach(l=>l.classList.remove('unlocked'));buildMaze();render();$('#win').classList.add('hidden');showToast('新的小鼠迷宫已经展开')}
$('#startBtn').onclick=()=>{started=true;$('#intro').classList.add('hidden');tone(720,.18)};$('#againBtn').onclick=restart;$$('.move').forEach(b=>b.onclick=()=>move(b.dataset.dir));addEventListener('keydown',e=>{const keys={ArrowUp:'up',w:'up',W:'up',ArrowRight:'right',d:'right',D:'right',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left'};if(keys[e.key]){e.preventDefault();move(keys[e.key])}});
buildMaze();render();if(new URLSearchParams(location.search).has('play')){started=true;$('#intro').classList.add('hidden')}
</script>
</body>
