<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>童话旅程 · 选择关卡</title>
<style>
:root{--paper:#fff8e6;--ink:#40291c;--gold:#e8be68}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#1e150f;color:var(--ink)}body{min-height:100vh;overflow-x:hidden}.page{position:relative;min-height:100vh;display:grid;place-items:center;padding:42px 24px;overflow:hidden;background:radial-gradient(circle at 50% 25%,#785738,#2e2016 62%,#17100c)}.page::before{content:"";position:absolute;inset:0;opacity:.3;background-image:radial-gradient(#f8d889 1px,transparent 1px);background-size:34px 34px;animation:drift 22s linear infinite}.leaf{position:absolute;font-size:34px;opacity:.28;animation:fall var(--d) linear infinite;left:var(--x);top:-60px;filter:blur(.2px)}
.shell{position:relative;z-index:2;width:min(1240px,100%)}header{text-align:center;color:#fff8e8;margin-bottom:27px;text-shadow:0 4px 15px #140b07}header .eyebrow{font:700 13px Georgia,serif;letter-spacing:.32em;color:#f4d591}header h1{font:900 clamp(36px,6vw,68px) Georgia,serif;margin:7px 0 5px;letter-spacing:.06em}header p{margin:0;color:#ecdcbf;font-size:15px}
.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:1080px;margin:auto}.chapter{position:relative;display:block;aspect-ratio:1.62;min-height:290px;overflow:hidden;border-radius:28px;border:4px solid #ecd493;background:#4d3524;box-shadow:0 25px 55px #0008;text-decoration:none;color:white;isolation:isolate;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}.chapter:hover{transform:translateY(-10px) scale(1.012);box-shadow:0 36px 75px #000a}.chapter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .5s}.chapter:hover img{transform:scale(1.07);filter:saturate(1.1)}.chapter.one img{object-position:center}.chapter.two img{object-position:center}.chapter.three img{object-position:center}.chapter.four img{object-position:center}.shade{position:absolute;inset:0;background:linear-gradient(transparent 34%,#20140bd9 78%,#160d08f5);z-index:1}.number{position:absolute;z-index:2;left:20px;top:18px;width:60px;height:60px;display:grid;place-items:center;border-radius:50%;background:#fff8e9ec;color:#614124;border:3px solid #d8aa53;font:900 25px Georgia,serif;box-shadow:0 8px 23px #0005}.copy{position:absolute;z-index:2;left:25px;right:25px;bottom:22px}.copy small{font:700 11px Georgia,serif;letter-spacing:.23em;color:#f1cf81}.copy h2{font:900 clamp(24px,3vw,35px) Georgia,serif;margin:4px 0 7px}.copy p{margin:0;color:#f4e5cc;font-size:13px;line-height:1.6;padding-right:38px}.play{position:absolute;z-index:3;right:22px;bottom:24px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#f5d67d;color:#4b301d;font-size:23px;box-shadow:0 5px 0 #a97931;transition:.3s}.chapter:hover .play{transform:translateX(4px);background:#fff0a9}.footer{text-align:center;margin-top:20px;color:#cbb89d;font-size:12px}.sound{position:fixed;z-index:5;right:17px;top:17px;width:44px;height:44px;border-radius:50%;border:2px solid #edd08d;background:#39271de6;color:#fff4d9;font-size:19px;cursor:pointer}
@keyframes drift{to{background-position:34px 34px}}@keyframes fall{to{transform:translateY(calc(100vh + 100px)) rotate(540deg)}}@media(max-width:760px){.page{padding:30px 14px}.chapters{grid-template-columns:1fr;gap:16px}.chapter{aspect-ratio:1.45;min-height:260px}.chapter.four{margin-bottom:15px}header{margin-bottom:18px}.copy p{max-width:80%}.number{width:48px;height:48px;font-size:20px}.play{width:44px;height:44px}.footer{display:none}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="page"><button class="sound" id="sound" aria-label="关闭音效">♫</button><span class="leaf" style="--x:8%;--d:14s">🍂</span><span class="leaf" style="--x:27%;--d:19s">✦</span><span class="leaf" style="--x:67%;--d:16s">🍃</span><span class="leaf" style="--x:89%;--d:21s">✧</span>
<div class="shell"><header><div class="eyebrow">WHIMSICAL JOURNEYS</div><h1>童话旅程</h1><p>选择今天想进入的故事</p></header><section class="chapters">

<a class="chapter three" href="level3.html"><img src="assets/elephant-maze-reference.jpg" alt="彩色花纹大象"><span class="shade"></span><span class="number">Ⅲ</span><span class="copy"><small>THE LOST COLOURS</small><h2>小鼠彩绘迷宫</h2><p>操控一只小老鼠走过迷宫收集六滴颜料，让大象的花纹重新拥有颜色。</p></span><span class="play">→</span></a>

<script>let on=true,audio;function tone(f=620){if(!on)return;audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.15)}document.querySelectorAll('.chapter').forEach((c,i)=>{c.addEventListener('pointerenter',()=>tone(560+i*100));c.addEventListener('click',()=>tone(820))});document.querySelector('#sound').onclick=e=>{on=!on;e.currentTarget.textContent=on?'♫':'×';if(on)tone(700)}</script></body></html>
