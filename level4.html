<style>
:root{--ink:#563d2d;--cream:#fff8e8;--coral:#ef826f;--gold:#f4c961}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:#cfeade}button,a{font:inherit}.game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(155deg,#ccebdd 0 45%,#f7d5c0 100%)}.game:before{content:"";position:absolute;inset:0;opacity:.42;background:radial-gradient(circle at 15% 20%,#fff 0 3px,transparent 4px),radial-gradient(circle at 80% 25%,#fff8 0 2px,transparent 3px);background-size:54px 54px,37px 37px}.topbar{position:absolute;z-index:50;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));height:54px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.topbar>*{pointer-events:auto}.back{border:3px solid var(--ink);background:#fffaf0;color:var(--ink);border-radius:18px;min-width:46px;height:46px;display:grid;place-items:center;text-decoration:none;font-weight:1000;box-shadow:0 5px 0 #a8785f,0 10px 22px #664b3e35}.level-title{text-align:center;line-height:1.05;background:#fffaf0e8;border:3px solid var(--ink);border-radius:19px;padding:7px 20px;box-shadow:0 5px 0 #a8785f}.level-title small{display:block;font:800 9px Georgia,serif;letter-spacing:.22em;color:#bc6d61}.level-title b{font:900 18px Georgia,serif}.counter{min-width:72px;padding:0 12px;font-size:18px}.counter em{font-style:normal;color:#d05e56}.scene-wrap{position:absolute;z-index:2;left:10px;right:10px;top:74px;bottom:188px;display:grid;place-items:center}.room{position:relative;height:100%;max-width:100%;aspect-ratio:1;background:#fff;border:4px solid #6b4a37;border-radius:27px;overflow:hidden;box-shadow:0 20px 48px #62483d55,0 0 0 8px #fff9e399}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}.target,.placed{position:absolute;padding:0;border:0;background:transparent;aspect-ratio:3/4;overflow:visible}.target{z-index:3;cursor:pointer;filter:drop-shadow(0 2px 1px #fff);transition:.2s}.target .sprite{filter:grayscale(1) brightness(1.1) contrast(.28);opacity:.32}.target:after{content:"";position:absolute;inset:12%;border:2px dashed #8c8478;border-radius:45%;opacity:.4}.target.hint{animation:targetPulse .75s ease-in-out 3;filter:drop-shadow(0 0 9px #ffe65c)}.target.wrong{animation:shake .35s}.target.done{opacity:0;scale:.65;pointer-events:none}.placed{z-index:8;pointer-events:none;filter:drop-shadow(0 4px 3px #4f382f55);animation:snap .48s cubic-bezier(.16,1.5,.4,1)}.sprite{position:absolute;inset:0;overflow:hidden;pointer-events:none}.sprite img{position:absolute;width:400%;height:300%;max-width:none;user-select:none;-webkit-user-drag:none}.sprite[data-col="0"] img{left:0}.sprite[data-col="1"] img{left:-100%}.sprite[data-col="2"] img{left:-200%}.sprite[data-col="3"] img{left:-300%}.sprite[data-row="0"] img{top:0}.sprite[data-row="1"] img{top:-100%}.sprite[data-row="2"] img{top:-200%}.reaction{position:absolute;z-index:18;pointer-events:none;font-weight:1000;color:#b96650;text-shadow:0 2px #fff;font-size:22px;animation:floatAway 1.35s forwards}.spark{position:absolute;z-index:17;pointer-events:none;font-size:20px;animation:spark .75s forwards}.album{position:absolute;z-index:30;left:50%;bottom:max(10px,env(safe-area-inset-bottom));translate:-50%;width:min(820px,calc(100% - 20px));height:164px;padding:15px 80px 11px 116px;border:4px solid #674735;border-radius:27px;background:linear-gradient(#fff5cc,#ffe9a6);box-shadow:0 9px 0 #aa7759,0 20px 38px #60453966;isolation:isolate}.album:before{content:"";position:absolute;z-index:-1;inset:8px;border:2px dashed #ddb86f;border-radius:19px}.album:after{content:"";position:absolute;z-index:2;left:20px;right:20px;top:-11px;height:20px;background:repeating-linear-gradient(90deg,#765340 0 5px,transparent 5px 25px);border-radius:99px}.page-info{position:absolute;left:18px;top:26px;width:86px;text-align:center}.page-info strong{display:block;font:900 22px Georgia,serif}.page-info small{display:block;margin-top:4px;font-weight:900;font-size:10px;letter-spacing:.1em;color:#b96e5f}.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dot{width:8px;height:8px;border-radius:50%;background:#d5b486}.dot.on{background:var(--coral);scale:1.35}.tray{height:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center}.cell{position:relative;height:120px;display:grid;place-items:center;border-radius:18px}.cell:after{content:"";position:absolute;inset:12px;border:2px dashed #d4b77f;border-radius:18px;opacity:.48}.cell.peeled:after{background:#ead5a4;box-shadow:inset 0 3px 9px #8a6b3a22}.sticker{position:relative;z-index:3;width:min(86px,100%);height:114px;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;filter:drop-shadow(0 5px 3px #553c2c55);transition:transform .2s,filter .2s}.sticker:hover,.sticker.selected{transform:translateY(-7px) rotate(-2deg) scale(1.05);filter:drop-shadow(0 0 7px #ffd34f) drop-shadow(0 8px 4px #553c2c44)}.sticker:after{content:"";position:absolute;right:7px;bottom:10px;width:24px;height:24px;background:linear-gradient(135deg,transparent 0 46%,#ddd 47% 60%,white 61%);border-radius:0 0 8px 0;filter:drop-shadow(1px 1px 1px #7655)}.sticker.dragging{position:fixed!important;z-index:1000!important;width:100px!important;height:133px!important;margin:0!important;transform:rotate(5deg) scale(1.08)!important;transition:none!important;cursor:grabbing;pointer-events:none}.album-actions{position:absolute;right:14px;top:25px;bottom:18px;width:55px;display:grid;gap:8px}.album-actions button{border:2px solid var(--ink);border-radius:16px;background:#fffaf0;color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 4px 0 #b17b5e}.album-actions button:active{translate:0 3px;box-shadow:0 1px 0 #b17b5e}.paw{position:fixed;z-index:990;width:66px;height:112px;border:3px solid #684636;border-radius:46% 46% 40% 40%;background:linear-gradient(110deg,#e8a56d,#c9764f);box-shadow:inset -8px -5px #b8624455,0 9px 12px #54372e44;pointer-events:none;display:none;transform:rotate(-28deg);transform-origin:50% 90%}.paw:before{content:"";position:absolute;left:8px;top:-18px;width:44px;height:48px;border:3px solid #684636;border-radius:50%;background:#e9a66e}.paw:after{content:"•••";position:absolute;top:-10px;left:10px;width:40px;text-align:center;color:#97563e;font-size:21px;letter-spacing:1px}.paw.show{display:block}.toast{position:absolute;z-index:140;left:50%;top:17%;translate:-50% -12px;opacity:0;max-width:80%;padding:10px 18px;border:2px solid #f8d57a;border-radius:999px;background:#4e382fea;color:#fff;text-align:center;font-weight:900;box-shadow:0 9px 23px #0004;pointer-events:none;transition:.25s}.toast.show{opacity:1;translate:-50% 0}.sheet-turn{position:absolute;z-index:120;left:50%;bottom:max(10px,env(safe-area-inset-bottom));translate:-50%;width:min(820px,calc(100% - 20px));height:164px;border:4px solid #674735;border-radius:27px;background:#fff1bb;transform-origin:left;animation:turn .66s forwards;pointer-events:none}.modal{position:absolute;z-index:210;inset:0;display:grid;place-items:center;padding:18px;background:#49342ac7;backdrop-filter:blur(8px)}.modal.hidden{display:none}.card{width:min(520px,100%);padding:22px;border:5px solid #664634;border-radius:30px;background:#fff9e9;text-align:center;box-shadow:0 24px 65px #0007}.preview{width:min(260px,70vw);aspect-ratio:1;object-fit:cover;border:4px solid #664634;border-radius:24px;background:white;box-shadow:0 7px 0 #b98568}.card h1{margin:14px 0 7px;font:900 31px Georgia,serif}.card p{margin:0 auto 17px;max-width:430px;font-size:14px;line-height:1.7}.primary,.secondary{display:inline-block;border:3px solid #654532;border-radius:16px;padding:11px 20px;font-weight:1000;text-decoration:none;cursor:pointer}.primary{background:var(--gold);color:#51382a;box-shadow:0 5px 0 #aa7552}.secondary{background:white;color:#51382a}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.confetti{position:fixed;z-index:240;top:-30px;left:var(--x);font-size:var(--s);animation:confetti var(--d) linear forwards;pointer-events:none}
@keyframes targetPulse{50%{scale:1.1;filter:drop-shadow(0 0 11px #ffe45a)}}@keyframes shake{25%{translate:-7px 0}75%{translate:7px 0}}@keyframes snap{from{scale:1.45;rotate:7deg;opacity:.35}}@keyframes spark{to{translate:0 -48px;scale:.3;rotate:110deg;opacity:0}}@keyframes floatAway{0%{opacity:0;translate:0 10px}25%,70%{opacity:1}to{opacity:0;translate:0 -36px}}@keyframes turn{to{transform:perspective(700px) rotateY(-108deg);opacity:0}}@keyframes confetti{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:0}}
@media(max-width:720px){.topbar{left:6px;right:6px}.back{height:41px;min-width:41px;font-size:12px}.level-title{padding:6px 10px}.level-title small{display:none}.level-title b{font-size:15px}.counter{min-width:58px;padding:0 7px}.scene-wrap{top:66px;bottom:197px;left:4px;right:4px}.room{border-radius:18px}.album,.sheet-turn{height:176px}.album{padding:49px 66px 8px 8px}.page-info{left:14px;top:13px;width:auto;text-align:left;display:flex;gap:8px;align-items:center}.page-info strong{font-size:17px}.page-info small{margin:0}.dots{margin:0}.tray{gap:2px}.cell{height:112px}.sticker{width:min(72px,100%);height:101px}.album-actions{right:9px;top:47px;bottom:12px;width:50px}.sheet-turn{height:176px}.card{padding:18px}.card h1{font-size:27px}.preview{width:min(210px,65vw)}}@media(max-height:680px) and (min-width:721px){.scene-wrap{top:66px;bottom:150px}.album,.sheet-turn{height:130px}.album{padding-top:8px}.cell{height:98px}.sticker{height:94px;width:70px}.page-info{top:18px}.album-actions{top:14px;bottom:12px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.target:after{display:none}</style></head><body><main class="game">
<header class="topbar"><a class="back" href="index.html" aria-label="返回选关">←</a><div class="level-title"><small>MY STICKER ROOM · 04</small><b>我的贴纸小屋</b></div><div class="back counter"><em id="count">0</em>/12</div></header>
<section class="scene-wrap"><div class="room" id="room"><img class="base" src="assets/sticker-room-empty.png" alt="等待布置的等距视角小屋"></div></section>
<section class="album"><div class="page-info"><strong id="pageNum">1/3</strong><small id="pageName">休息时光</small><div class="dots" id="dots"></div></div><div class="tray" id="tray"></div><div class="album-actions"><button id="pageBtn" aria-label="下一页">›</button><button id="hintBtn" aria-label="提示">💡</button><button id="soundBtn" aria-label="音效">♫</button></div></section>
<div class="paw" id="paw"></div><div class="toast" id="toast"></div>
<section class="modal" id="intro"><div class="card"><img class="preview" src="assets/sticker-room-sprites.png" alt="家具和动物贴纸"><h1>撕开你的贴纸册</h1><p>按住贴纸揭下来，拖到房间中形状一致的浅灰轮廓。靠近正确位置会自动吸附；轻点贴纸再轻点轮廓也可以。</p><button class="primary" id="startBtn">开始布置</button></div></section>
<section class="modal hidden" id="win"><div class="card"><img class="preview" src="assets/sticker-room-reference.jpg" alt="布置完成的温馨小屋"><h1>小屋住进了故事！</h1><p>12张贴纸全部归位，猫咪、茶香和阳台花园都活了起来。</p><div class="actions"><button class="primary" id="replayBtn">重新布置</button><a class="secondary" href="index.html">返回选关</a></div></div></section></main>
<script>
const SHEET='assets/sticker-room-sprites.png',ITEMS=[{id:'bed',name:'猫咪小床',p:0,c:0,r:0,x:49,y:8,w:22},{id:'sofa',name:'猫咪沙发',p:0,c:1,r:0,x:68,y:39,w:22},{id:'tv',name:'电视与绿植',p:0,c:2,r:0,x:52,y:39,w:20},{id:'table',name:'茶几',p:0,c:3,r:0,x:64,y:53,w:19},{id:'craft',name:'手作桌',p:1,c:0,r:1,x:20,y:59,w:24},{id:'books',name:'猫咪书柜',p:1,c:1,r:1,x:40,y:38,w:18},{id:'balcony',name:'阳台花架',p:1,c:2,r:1,x:78,y:65,w:18},{id:'entry',name:'玄关鞋柜',p:1,c:3,r:1,x:48,y:71,w:19},{id:'rack',name:'衣帽架',p:2,c:0,r:2,x:25,y:39,w:18},{id:'shelf',name:'书与画框',p:2,c:1,r:2,x:75,y:27,w:17},{id:'rug',name:'软垫地毯',p:2,c:2,r:2,x:57,y:60,w:21},{id:'lamp',name:'壁灯与时钟',p:2,c:3,r:2,x:59,y:18,w:15}],PAGES=['休息时光','创作与花园','温柔收尾'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let page=0,placed=new Set(),selected=null,drag=null,started=false,sound=true,audio;
function sprite(i){return `<span class="sprite" data-col="${i.c}" data-row="${i.r}"><img src="${SHEET}" alt=""></span>`}function tone(f=660,d=.12,type='triangle'){if(!sound)return;try{audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function say(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function buildTargets(){const room=$('#room');room.querySelectorAll('.target,.placed,.spark,.reaction').forEach(n=>n.remove());ITEMS.forEach(i=>{const b=document.createElement('button');b.className='target';b.dataset.id=i.id;b.setAttribute('aria-label',i.name+'的浅灰轮廓');b.style.cssText=`left:${i.x}%;top:${i.y}%;width:${i.w}%`;b.innerHTML=sprite(i);b.onclick=()=>tapTarget(i,b);room.appendChild(b)})}
function render(){$('#pageNum').textContent=`${page+1}/3`;$('#pageName').textContent=PAGES[page];$('#dots').innerHTML=PAGES.map((_,n)=>`<i class="dot ${n===page?'on':''}"></i>`).join('');const tray=$('#tray');tray.innerHTML='';ITEMS.filter(i=>i.p===page).forEach(i=>{const cell=document.createElement('div');cell.className='cell'+(placed.has(i.id)?' peeled':'');if(!placed.has(i.id)){const b=document.createElement('button');b.className='sticker';b.dataset.id=i.id;b.setAttribute('aria-label','贴纸：'+i.name);b.innerHTML=sprite(i);b.onpointerdown=e=>beginDrag(e,b,i);cell.appendChild(b)}tray.appendChild(cell)});$('#pageBtn').textContent=page===2?'‹':'›'}
function beginDrag(e,el,item){if(!started||placed.has(item.id))return;e.preventDefault();select(null);const cell=el.parentElement,r=el.getBoundingClientRect(),marker=document.createElement('div');marker.className='cell peeled';cell.replaceWith(marker);document.body.appendChild(el);el.classList.add('dragging');Object.assign(el.style,{left:r.left+'px',top:r.top+'px'});drag={el,item,marker,cell,dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,moved:false};movePaw(e.clientX,e.clientY,true);tone(420,.08,'sine')}
addEventListener('pointermove',e=>{if(!drag)return;drag.moved ||= Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5;drag.el.style.left=e.clientX-drag.dx+'px';drag.el.style.top=e.clientY-drag.dy+'px';movePaw(e.clientX,e.clientY,true)});addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;movePaw(0,0,false);if(!d.moved){restore(d,()=>select(d.el));return}const target=$(`.target[data-id="${d.item.id}"]`).getBoundingClientRect(),piece=d.el.getBoundingClientRect(),tx=target.left+target.width/2,ty=target.top+target.height/2,cx=piece.left+piece.width/2,cy=piece.top+piece.height/2,tol=Math.max(52,target.width*.75);if(Math.hypot(cx-tx,cy-ty)<tol)place(d.item,d.el,d.marker);else{tone(155,.12,'square');say('还不是这里，看看浅灰轮廓');restore(d)}});
function movePaw(x,y,on){const p=$('#paw');p.classList.toggle('show',on);if(on){p.style.left=x+23+'px';p.style.top=y+18+'px'}}function restore(d,done){const r=d.marker.getBoundingClientRect();d.el.style.transition='left .32s,top .32s,transform .32s';d.el.style.left=r.left+(r.width-100)/2+'px';d.el.style.top=r.top+(r.height-133)/2+'px';d.el.style.transform='scale(.88)';setTimeout(()=>{d.el.className='sticker';d.el.removeAttribute('style');d.marker.replaceWith(d.cell);d.cell.appendChild(d.el);done?.()},340)}function select(el){$$('.sticker.selected').forEach(n=>n.classList.remove('selected'));selected=null;if(el){el.classList.add('selected');selected=el.dataset.id;say('再点房间里相同形状的浅灰位置')}}
function tapTarget(item,target){if(!started||placed.has(item.id))return;if(!selected){target.classList.add('hint');setTimeout(()=>target.classList.remove('hint'),1400);say('先从贴纸册选一张贴纸');return}if(selected!==item.id){target.classList.add('wrong');setTimeout(()=>target.classList.remove('wrong'),380);tone(150,.1,'square');say('形状对不上，再观察一下');return}place(item,$(`.sticker[data-id="${item.id}"]`),null)}
function place(item,el,marker){if(placed.has(item.id))return;placed.add(item.id);selected=null;marker?.remove();el.remove();const p=document.createElement('div');p.className='placed';p.dataset.id=item.id;p.style.cssText=`left:${item.x}%;top:${item.y}%;width:${item.w}%`;p.innerHTML=sprite(item);$('#room').appendChild(p);const target=$(`.target[data-id="${item.id}"]`);target?.classList.add('done');setTimeout(()=>target?.remove(),260);$('#count').textContent=placed.size;spark(item);react(item);tone(720+placed.size*32,.16);render();if(placed.size===ITEMS.length)setTimeout(finish,700)}
function spark(item){for(let n=0;n<6;n++){const s=document.createElement('i');s.className='spark';s.textContent=n%2?'✦':'★';s.style.left=item.x+item.w*(.15+Math.random()*.7)+'%';s.style.top=item.y+18+Math.random()*8+'%';s.style.color=['#ed7867','#f4cc58','#62bda3'][n%3];$('#room').appendChild(s);setTimeout(()=>s.remove(),800)}}function react(item){const words={bed:'Z z z…',sofa:'喵～',table:'♨ 茶香',craft:'咔哒咔哒',books:'呼噜…',balcony:'🦋',entry:'欢迎回家',rack:'衣角轻摆',shelf:'✦',rug:'软绵绵',lamp:'叮咚',tv:'♪'};const r=document.createElement('span');r.className='reaction';r.textContent=words[item.id]||'✦';r.style.left=item.x+item.w*.35+'%';r.style.top=item.y+'%';$('#room').appendChild(r);setTimeout(()=>r.remove(),1400)}
function turnPage(){const f=document.createElement('div');f.className='sheet-turn';document.querySelector('.game').appendChild(f);tone(520,.17,'sine');setTimeout(()=>{page=page===2?0:page+1;render();f.remove()},560)}function hint(){const candidates=ITEMS.filter(i=>i.p===page&&!placed.has(i.id)),item=candidates[0]||ITEMS.find(i=>!placed.has(i.id));if(!item){say('全部贴好啦！');return}if(item.p!==page){page=item.p;render()}setTimeout(()=>{const t=$(`.target[data-id="${item.id}"]`);t?.classList.add('hint');setTimeout(()=>t?.classList.remove('hint'),2100);say('闪光处就是这张贴纸的位置')},80);tone(930,.18)}
function finish(){started=false;for(let i=0;i<38;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['◆','●','★','✦'][i%4];c.style.setProperty('--x',Math.random()*100+'%');c.style.setProperty('--dx',(Math.random()-.5)*260+'px');c.style.setProperty('--s',13+Math.random()*20+'px');c.style.setProperty('--d',1.8+Math.random()*1.4+'s');c.style.color=['#ef765f','#f5c75b','#68baa8','#8b73d8'][i%4];document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}tone(980,.28);setTimeout(()=>tone(1240,.35),170);setTimeout(()=>$('#win').classList.remove('hidden'),700)}function reset(){placed.clear();page=0;selected=null;started=true;$('#count').textContent='0';$('#win').classList.add('hidden');buildTargets();render();say('新的贴纸册准备好了')}
$('#startBtn').onclick=()=>{started=true;$('#intro').classList.add('hidden');tone(720,.2)};$('#pageBtn').onclick=turnPage;$('#hintBtn').onclick=hint;$('#soundBtn').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫':'×';if(sound)tone(680)};$('#replayBtn').onclick=reset;buildTargets();render();if(new URLSearchParams(location.search).has('play')){started=true;$('#intro').classList.add('hidden')}
</script></body></html>
